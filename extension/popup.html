<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NearbyShare</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot" id="statusDot"></span>
      <span>NearbyShare</span>
    </div>
    <div class="tools">
      <button id="openPanelBtn" class="ghost" data-i18n-title="popupOpenFullPanel" data-i18n-aria="popupOpenFullPanel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </button>
      <button id="optionsBtn" class="ghost" data-i18n-title="popupSettings" data-i18n-aria="popupSettings">⚙</button>
    </div>
  </header>

  <div id="offlineBanner" class="banner offline" hidden>
    <div class="banner-title" data-i18n="popupOfflineTitle"></div>
    <div class="banner-msg" data-i18n="popupOfflineMsg"></div>
    <div class="banner-actions">
      <button id="downloadBtn" class="primary" data-i18n="popupDownload"></button>
      <button id="cmdBtn" class="secondary" data-i18n="popupCopyCommand"></button>
      <button id="retryBtn" class="secondary" data-i18n="popupRetry"></button>
    </div>
  </div>

  <div id="onlineBanner" class="banner online" hidden>
    <div class="banner-title" id="onlineTitle" data-i18n="popupOnlineTitle"></div>
    <div class="banner-msg" id="onlineUrl">http://localhost:3000</div>
    <div class="lan-block">
      <div class="lan-header" data-i18n="popupOtherDevices"></div>
      <div id="lanUrls" class="lan-urls"></div>
    </div>
  </div>

  <section class="composer">
    <textarea id="text" rows="3" data-i18n-placeholder="popupTextPlaceholder"></textarea>
    <div class="row">
      <input type="file" id="file" multiple hidden>
      <button id="fileBtn" class="secondary" data-i18n="popupAddFiles"></button>
      <button id="sendBtn" class="primary" data-i18n="popupSend" disabled></button>
    </div>
    <div id="uploadStatus" class="status"></div>
  </section>

  <section class="quick">
    <div class="quick-title" data-i18n="popupQuickActions"></div>
    <button id="sendPageBtn" class="chip" data-i18n="popupSendCurrentPage"></button>
    <button id="sendSelBtn" class="chip" data-i18n="popupSendSelection"></button>
  </section>

  <section class="recent">
    <div class="recent-title">
      <span data-i18n="popupRecent"></span>
      <a id="openFullBtn" href="#" data-i18n="popupViewAll"></a>
    </div>
    <div id="recentList" class="recent-list">
      <div class="empty" data-i18n="popupEmpty"></div>
    </div>
  </section>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
