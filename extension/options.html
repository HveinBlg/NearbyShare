<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NearbyShare</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: 380px; padding: 12px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    input[type="text"], input[type="url"] {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; outline: none;
    }
    input[type="text"]:focus, input[type="url"]:focus { border-color: var(--primary); }
    .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .actions { margin-top: 14px; display: flex; gap: 6px; }
    .saved { font-size: 12px; color: var(--success); margin-left: 8px; align-self: center; }
  </style>
</head>
<body>
  <h3 style="margin: 0 0 6px; color: var(--primary);" data-i18n="optionsHeading"></h3>

  <label for="serverUrl" data-i18n="optionsServerLabel"></label>
  <input id="serverUrl" type="url" placeholder="http://localhost:3000">
  <div class="hint" data-i18n="optionsServerHint"></div>

  <label for="displayName" data-i18n="optionsNameLabel"></label>
  <input id="displayName" type="text" data-i18n-placeholder="popupDefaultName" maxlength="20">

  <div class="actions">
    <button id="saveBtn" class="primary" data-i18n="optionsSave"></button>
    <button id="testBtn" class="secondary" data-i18n="optionsTest"></button>
    <span id="msg" class="saved"></span>
  </div>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
