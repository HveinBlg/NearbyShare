<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NearbyShare Screenshot 640x400 EN</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 640px; height: 400px;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #2563eb 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #fff;
  overflow: hidden;
}
.container {
  text-align: center;
  padding: 40px;
}
h1 {
  font-size: 36px; font-weight: 700; margin-bottom: 10px;
  background: linear-gradient(90deg, #fff, #93c5fd);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
p {
  font-size: 16px; opacity: 0.85; margin-bottom: 24px; line-height: 1.5;
}
.tags {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
}
.tag {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 6px 14px; border-radius: 16px;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="container">
  <h1>NearbyShare</h1>
  <p>LAN Multi-Device Transfer<br>Phone opens browser — No app needed · Zero cloud</p>
  <div class="tags">
    <div class="tag">Text</div>
    <div class="tag">Images</div>
    <div class="tag">Files</div>
    <div class="tag">Real-time Sync</div>
    <div class="tag">Cross-Platform</div>
    <div class="tag">Free</div>
  </div>
</div>
</body>
</html>
